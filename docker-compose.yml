# FlightInsight local-only development / portfolio stack.
# The one-shot db-roles service provisions read-only API credentials on
# both new PostgreSQL volumes and volumes created by earlier releases.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightinsight}
      POSTGRES_USER: ${POSTGRES_USER:-flightinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run start.cmd or start.sh to generate .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  etl:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.etl
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightinsight}
      POSTGRES_USER: ${POSTGRES_USER:-flightinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run start.cmd or start.sh first}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./data/raw:/app/data/raw:ro
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  db-roles:
    build:
      context: .
      dockerfile: Dockerfile.etl
    command: ["python", "scripts/provision_api_role.py"]
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightinsight}
      POSTGRES_USER: ${POSTGRES_USER:-flightinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run start.cmd or start.sh first}
      POSTGRES_READ_USER: flightinsight_reader
      POSTGRES_READ_PASSWORD: ${POSTGRES_READ_PASSWORD:?Run scripts/init_env.py first}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  analytics:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.etl
    command: ["python", "scripts/run_analytics.py", "summary"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightinsight}
      POSTGRES_USER: flightinsight_reader
      POSTGRES_PASSWORD: ${POSTGRES_READ_PASSWORD:?Run scripts/init_env.py first}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      db-roles:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightinsight}
      POSTGRES_USER: flightinsight_reader
      POSTGRES_PASSWORD: ${POSTGRES_READ_PASSWORD:?Run scripts/init_env.py first}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db-roles:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 35s

volumes:
  postgres_data:
