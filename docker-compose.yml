# Stage 6: PostgreSQL, ETL, SQL analytics and read-only FastAPI.
# Streamlit dashboard is planned for Stage 7.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightinsight}
      POSTGRES_USER: ${POSTGRES_USER:-flightinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  etl:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.etl
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightinsight}
      POSTGRES_USER: ${POSTGRES_USER:-flightinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./data/raw:/app/data/raw:ro
    depends_on:
      postgres:
        condition: service_healthy

  analytics:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.etl
    command: ["python", "scripts/run_analytics.py", "summary"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightinsight}
      POSTGRES_USER: ${POSTGRES_USER:-flightinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy


  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightinsight}
      POSTGRES_USER: ${POSTGRES_USER:-flightinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
